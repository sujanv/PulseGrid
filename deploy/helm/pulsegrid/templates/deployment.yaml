apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pulsegrid
  template:
    metadata:
      labels:
        app: pulsegrid
    spec:
      containers:
        - name: pulsegrid
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
